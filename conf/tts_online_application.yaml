# This is the parameter configuration file for streaming tts server.

#################################################################################
#                             SERVER SETTING                                    #
#################################################################################
host: 0.0.0.0
port: 8092

# The task format in the engin_list is: <speech task>_<engine type>
# engine_list choices = ['tts_online', 'tts_online-onnx'], the inference speed of tts_online-onnx is faster than tts_online.
# protocol choices = ['websocket', 'http'] 
protocol: 'http'
engine_list: ['tts_online-onnx']


#################################################################################
#                                ENGINE CONFIG                                  #
#################################################################################

################################### TTS #########################################
################### speech task: tts; engine_type: online #######################
tts_online: 
    # am (acoustic model) choices for English could be 'fastspeech2_ljspeech'
    # If 'fastspeech2_ljspeech' is not a cnndecoder variant, streaming AM might be different.
    am: 'fastspeech2_ljspeech'   
    am_config: 
    am_ckpt: 
    am_stat: 
    phones_dict: 
    tones_dict:  # Not applicable for English
    speaker_dict: # LJSpeech is single-speaker
    

    # voc (vocoder) choices for English could be 'hifigan_ljspeech'
    # Both mb_melgan and hifigan support streaming voc inference
    voc: 'hifigan_ljspeech'
    voc_config: 
    voc_ckpt: 
    voc_stat: 

    # others
    lang: 'en' # Changed to English
    device: 'cpu' # set 'gpu:id' or 'cpu'
    # am_block and am_pad are for fastspeech2_cnndecoder model for streaming am infer.
    # These values might need adjustment for 'fastspeech2_ljspeech'.
    am_block: 72
    am_pad: 12
    # voc_pad and voc_block for voc model to streaming voc infer.
    # For hifigan, voc_pad: 14 is a reasonable value based on comments for hifigan_csmsc.
    voc_block: 36
    voc_pad: 14
    


#################################################################################
#                                ENGINE CONFIG                                  #
#################################################################################

################################### TTS #########################################
################### speech task: tts; engine_type: online-onnx #######################
tts_online-onnx: 
    # am (acoustic model) choices for English: 'fastspeech2_ljspeech_onnx'
    # If 'fastspeech2_ljspeech_onnx' is not a cnndecoder variant, streaming AM might be different.
    am: 'fastspeech2_ljspeech_onnx' 
    # am_ckpt is a list. For fastspeech2_ljspeech_onnx (if non-cnndecoder), it's usually [ckpt model].
    # Left empty to use default pretrained model.
    am_ckpt:   # list
    am_stat: 
    phones_dict: 
    tones_dict:  # Not applicable for English
    speaker_dict: # LJSpeech is single-speaker
    am_sample_rate: 22050 # Typical for LJSpeech
    am_sess_conf:
        device: "cpu" # set 'gpu:id' or 'cpu'
        use_trt: False
        cpu_threads: 4

    # voc (vocoder) choices for English: 'hifigan_ljspeech_onnx'
    # Both mb_melgan_onnx and hifigan_onnx support streaming voc inference
    voc: 'hifigan_ljspeech_onnx'
    voc_ckpt: 
    voc_sample_rate: 22050 # Typical for LJSpeech
    voc_sess_conf:
        device: "cpu" # set 'gpu:id' or 'cpu'
        use_trt: False
        cpu_threads: 4

    # others
    lang: 'en' # Changed to English
    # am_block and am_pad for fastspeech2_cnndecoder_onnx model for streaming am infer.
    # These values might need adjustment for 'fastspeech2_ljspeech_onnx'.
    am_block: 72
    am_pad: 12
    # voc_pad and voc_block for voc model to streaming voc infer.
    # For hifigan_ljspeech_onnx, voc_pad: 14 is a reasonable value.
    voc_block: 36
    voc_pad: 14
    # voc_upsample should be same as n_shift (hop_length) in voc config.
    # For HiFiGAN LJSpeech (22050Hz, hop_length 256), this is 256.
    voc_upsample: 256
    
