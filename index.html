<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime TTS Stream Player</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 700px; margin-left: auto; margin-right: auto; }
        textarea { width: 100%; box-sizing: border-box; min-height: 80px; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        label { display: block; margin-bottom: 5px; }
        input[type="number"] { padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-style: italic; color: #555; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom:15px; }
        .control-group label { margin-bottom: 2px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Realtime TTS Stream Player</h1>
    
    <label for="text-input">Text to Synthesize:</label>
    <textarea id="text-input">Life was like a box of chocolates, you never know what you're gonna get.</textarea>
    
    <div class="controls-grid">
        <div class="control-group">
            <label for="spk-id-input">Speaker ID:</label>
            <input type="number" id="spk-id-input" value="0" min="0">
        </div>
        <div class="control-group">
            <label for="speed-input">Speed (0.1-3.0):</label>
            <input type="number" id="speed-input" value="1.0" min="0.1" max="3.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="volume-input">Volume (0.1-2.0):</label>
            <input type="number" id="volume-input" value="1.0" min="0.1" max="2.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="sample-rate-input">Requested SR (0 for server default):</label>
            <input type="number" id="sample-rate-input" value="0" min="0" step="1000">
        </div>
    </div>

    <button id="play-button">Play Stream</button>
    <button id="stop-button" disabled>Stop Stream</button>
    <div id="status">Ready.</div>

    <div id="performance-metrics" style="margin-top: 20px; border: 1px solid #eee; padding: 10px; border-radius: 4px; display: none;">
        <h3>Performance Metrics:</h3>
        <p>Time to First Chunk: <span id="metric-ttfb">-</span> s</p>
        <p>Total Chunks Received: <span id="metric-chunks">-</span></p>
        <p>Total Audio Bytes (PCM): <span id="metric-bytes">-</span></p>
        <p>Estimated Audio Duration: <span id="metric-audio-duration">-</span> s</p>
        <p>Total Streaming Time: <span id="metric-total-time">-</span> s</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
